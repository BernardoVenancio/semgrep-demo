{% extends "base.html" %}

{% block title %}Adicionar livro{% endblock %}

{% block content %}
<section class="page-heading">
    <p class="eyebrow">Nova leitura</p>
    <h1>Adicionar livro</h1>
</section>

<form class="card form" method="POST">
    <label>
        Título
        <input type="text" name="title" required>
    </label>

    <label>
        Autor
        <input type="text" name="author" required>
    </label>

    <label>
        Nota (0 a 10)
        <input type="number" name="rating" min="0" max="10">
    </label>

    <label>
        Resenha
        <textarea name="review" rows="5"></textarea>
    </label>

    <button class="button" type="submit">Salvar livro</button>
</form>
{% endblock %}
